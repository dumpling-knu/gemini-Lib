<title>박미자 스탬프 투어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: 한 화면에 다 보이는 구성. 위: 제목과 진행도, 가운데: 하늘 위 S자 입장권 띠 지도, 아래: 로고와 스캔 버튼. */
:root{
  color-scheme: light;
  --sky:#8EC5F0; --sky-hi:#B9DDF7; --cloud:#FFFFFF;
  --paper:#F6EEDB; --paper-dim:#E9DFC6; --edge:#9BC53D; --edge-deep:#6E9A1F;
  --ink:#3B2E22; --ink-soft:#7A6A55;
  --red:#E0473E; --pink:#F29BB8; --green:#3FA34D; --navy:#1F4E79;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --dock:86px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.55;
  background:
    radial-gradient(ellipse 120px 46px at 10% 12%, var(--cloud) 60%, transparent 62%),
    radial-gradient(ellipse 90px 40px at 20% 9%, var(--cloud) 60%, transparent 62%),
    radial-gradient(ellipse 140px 50px at 90% 46%, var(--cloud) 60%, transparent 62%),
    radial-gradient(ellipse 100px 42px at 80% 43%, var(--cloud) 60%, transparent 62%),
    radial-gradient(ellipse 130px 48px at 6% 74%, var(--cloud) 60%, transparent 62%),
    linear-gradient(180deg, var(--sky-hi) 0%, var(--sky) 45%, var(--sky) 100%);
  background-attachment:fixed;
  background-color:var(--sky);
}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--dock) + env(safe-area-inset-bottom,0px))}
header{text-align:center;display:grid;gap:8px;justify-items:center}
h1{
  margin:0;font-family:var(--display);font-weight:400;color:#fff;line-height:1.1;
  font-size:clamp(30px,9vw,40px);letter-spacing:-.01em;white-space:nowrap;
  text-shadow:0 3px 0 var(--navy),3px 0 0 var(--navy),-3px 0 0 var(--navy),0 -3px 0 var(--navy),3px 3px 0 var(--navy),-3px 3px 0 var(--navy),3px -3px 0 var(--navy),-3px -3px 0 var(--navy),0 6px 0 rgba(31,78,121,.35);
}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;background:var(--green);color:#fff;font-family:var(--display);font-size:13px;letter-spacing:.1em;padding:4px 10px 3px;border:3px solid #fff;transform:rotate(-3deg);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.progress{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:5px 12px 5px 6px;box-shadow:0 3px 0 rgba(31,78,121,.18)}
.chip{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:14px;color:var(--ink-soft);border:2px dashed var(--ink-soft);background:var(--paper-dim)}
.chip.on{color:#fff;border:2px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.chip.on[data-k=park]{background:var(--red)} .chip.on[data-k=mi]{background:var(--pink)} .chip.on[data-k=ja]{background:var(--green)}
.count{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink);margin-left:2px}
.hint{margin:0;font-size:13px;color:var(--navy);font-weight:700;line-height:1.35}

.map{margin-top:4px;display:flex;justify-content:center}
.map svg{display:block;overflow:visible;aspect-ratio:360/500;width:auto;max-width:100%;
  height:min(500px, calc(100vh - 215px - var(--dock)));
  height:min(500px, calc(100svh - 215px - var(--dock)));
  min-height:300px}
.stamp{cursor:pointer;outline:none}
.stamp .shape{transition:fill .3s}
.stamp:focus-visible .focus{stroke:var(--navy);stroke-width:4;stroke-dasharray:6 5}
.stamp .pop{transform-box:fill-box;transform-origin:center}
.stamp.just .pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.bob{animation:bob 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}

.dock{position:fixed;left:0;right:0;bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,rgba(95,168,227,.6) 45%);z-index:5}
.dock-in{max-width:460px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{height:62px;width:auto;flex:none;filter:drop-shadow(0 3px 3px rgba(31,78,121,.25))}
.btn{font:inherit;cursor:pointer;border:none}
.scan{font-family:var(--display);font-size:19px;color:#fff;background:var(--red);border:4px solid #fff;border-radius:18px;padding:11px 18px;transform:rotate(-2deg);box-shadow:0 5px 0 #9d2a23,0 8px 18px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.scan:active{transform:rotate(-2deg) translateY(4px);box-shadow:0 1px 0 #9d2a23}
.scan svg{width:24px;height:24px}
.gear{width:48px;height:48px;border-radius:50%;background:var(--paper);border:3px solid #fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 rgba(31,78,121,.3);flex:none}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,40,60,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto;position:relative;border-top:6px dashed var(--edge);animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.close{position:absolute;top:12px;right:14px;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--ink);font-size:20px;line-height:1}
.sheet h2{margin:0 44px 4px 0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2}
.sheet .eyebrow{font-size:13px;color:var(--ink-soft);letter-spacing:.06em}
.sheet p{margin:8px 0}
.stack{display:grid;gap:10px;margin-top:14px}
.big{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:18px;padding:14px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:center}
.big.red{background:var(--red);color:#fff}
.big.green{background:var(--green);color:#fff}
.big.insta{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF);color:#fff}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.row{display:flex;gap:8px}
.field{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px;border-radius:12px;border:2px solid var(--ink-soft);background:#fff;color:var(--ink);text-transform:uppercase}
.field:focus{outline:3px solid var(--edge);border-color:var(--ink)}
.small{font-size:13px;color:var(--ink-soft)}
.step{display:flex;gap:10px;align-items:flex-start}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);display:grid;place-items:center;font-size:14px;margin-top:2px}
.step > div{min-width:0;flex:1}
.shot{display:block;max-width:100%;max-height:300px;margin:10px auto 0;border-radius:12px;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.done-tag{display:inline-block;background:var(--green);color:#fff;font-family:var(--display);padding:3px 10px;border-radius:8px;transform:rotate(-2deg)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0;background:#fff;border-radius:12px;padding:10px 14px}
.meta dt{color:var(--ink-soft)} .meta dd{margin:0}
.busy{display:flex;align-items:center;gap:10px;justify-content:center;padding:10px;color:var(--ink-soft)}
.tips{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-soft)}

.finish{text-align:center}
.finish .starwrap{width:200px;max-width:65%;margin:0 auto}
.finish h2{margin:0;font-size:30px}
.redeemed{display:inline-block;margin-top:10px;border:4px solid var(--red);color:var(--red);font-family:var(--display);font-size:22px;padding:4px 16px;border-radius:10px;transform:rotate(-8deg);opacity:.9}

.toast{position:fixed;left:50%;bottom:calc(var(--dock) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:40;width:max-content;max-width:calc(100% - 32px);text-align:center;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- QR 읽기: 기본 탐지기 → ZXing → jsQR 순서로, 크기와 영역을 바꿔 가며 시도 ---------- */
function loadImg(file){ return new Promise((res,rej)=>{ const u = URL.createObjectURL(file); const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u; }); }
function zxingRead(data, w, h){
  if (!window.ZXing) return null;
  const Z = window.ZXing; const lum = new Uint8ClampedArray(w*h);
  for (let i=0;i<w*h;i++) lum[i] = (data[i*4]*299 + data[i*4+1]*587 + data[i*4+2]*114)/1000 | 0;
  const hints = new Map([[Z.DecodeHintType.TRY_HARDER,true],[Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.QR_CODE]]]);
  for (const B of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]){
    try { return new Z.QRCodeReader().decode(new Z.BinaryBitmap(new B(new Z.RGBLuminanceSource(lum,w,h))), hints).getText(); } catch(e){}
  }
  return null;
}
async function decode(file){
  const img = await loadImg(file);
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement("canvas"); const ctx = c.getContext("2d", { willReadFrequently:true });
  const det = ("BarcodeDetector" in window) ? (()=>{ try { return new BarcodeDetector({formats:["qr_code"]}); } catch(e){ return null; } })() : null;
  const crops = [1, 0.7, 0.45];
  const sizes = [1000, 640, 1400];
  for (const cr of crops){
    const cw = W*cr, ch = H*cr, cx = (W-cw)/2, cy = (H-ch)/2;
    for (const max of sizes){
      const s = Math.min(1, max/Math.max(cw,ch));
      c.width = Math.max(1, Math.round(cw*s)); c.height = Math.max(1, Math.round(ch*s));
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img, cx, cy, cw, ch, 0, 0, c.width, c.height);
      if (det){ try { const r = await det.detect(c); if (r && r[0]) return r[0].rawValue; } catch(e){} }
      const d = ctx.getImageData(0,0,c.width,c.height);
      const z = zxingRead(d.data, c.width, c.height); if (z) return z;
      if (window.jsQR){ const r = jsQR(d.data, c.width, c.height, {inversionAttempts:"attemptBoth"}); if (r && r.data) return r.data; }
    }
  }
  return null;
}
async function onPhoto(e){
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  const busy = $("#busy"); if (busy) busy.hidden = false;
  await new Promise(r=>setTimeout(r,30));
  let text = null; try { text = await decode(f); } catch(err) {}
  if (busy) busy.hidden = true;
  if (!text) return toast("QR을 찾지 못했어요. QR이 화면 가운데 크게 나오게 다시 찍어 주세요.", 3600);
  handleCode(text);
}

function handleCode(text){
  const t = String(text).replace(/\s/g,"");
  // 네이버 단축코드는 대소문자를 구분하므로 그대로 비교
  const p = CONFIG.places.find(p => p.codes.some(code => t.includes(code)));
  if (!p) return toast("박미자 투어의 QR이 아니에요");
  if (S.stamps[p.key]) { closeSheet(); return toast(`'${p.ch}' 스탬프는 이미 받았어요`); }
  award(p.key);
}

function award(k){
  S.stamps[k] = Date.now();
  if (count()===3 && !S.completedAt) S.completedAt = Date.now();
  save(); closeSheet(); drawMap(k);
  try { navigator.vibrate && navigator.vibrate([60,40,90]); } catch(e){}
  const p = place(k);
  if (count()===3){ confetti(); setTimeout(openFinish, 900); }
  else toast(`'${p.ch}' 스탬프 획득! ${3-count()}개 남았어요`);
}

    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);

    <h2>박미자 완성!</h2>
    <p>${S.completedAt?fmt(S.completedAt)+" 완주":""}</p>
    <p><b>${esc(CONFIG.reward)}</b></p>
    ${S.redeemed?`<div class="redeemed">기념품 수령 완료</div><p class="small">${fmt(S.redeemed)}</p>`:""}
    ${S.shot?`<p class="small" style="margin-top:16px">직원 확인용 · 인스타 팔로우 캡처</p><img class="shot" src="${S.shot}" alt="인스타 팔로우 캡처">`:""}
    ${S.redeemed?"":`<div class="stack" style="text-align:left;margin-top:18px">
      <label class="small" for="pinIn">직원 전용 · 기념품을 드린 뒤 비밀번호를 입력하세요</label>
      <div class="row"><input class="field" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><button class="big" type="button" data-act="pin" style="padding:12px 16px">지급 완료</button></div></div>`}
  </div>`);
  bindActs();
}
function checkPin(){
  if ($("#pinIn").value.trim() !== CONFIG.staffPin) return toast("비밀번호가 맞지 않아요");
  S.redeemed = Date.now(); save(); openFinish(); toast("기념품 지급 완료로 표시했어요");
}

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = $("#confetti"); const cols = ["#E0473E","#F29BB8","#3FA34D","#F2C14E","#fff","#4FA3E0"];
  for (let i=0;i<70;i++){ const p=document.createElement("i"); p.style.left=Math.random()*100+"vw"; p.style.background=cols[i%cols.length]; p.style.animationDuration=(1.8+Math.random()*1.8)+"s"; p.style.animationDelay=(Math.random()*.6)+"s"; box.appendChild(p); }
  setTimeout(()=>box.innerHTML="",4500);
}

/* ---------- 설정 ---------- */
$("#gearBtn").addEventListener("click", () => {
  openSheet(`<h2>설정</h2>
    <p class="small">기록은 이 휴대폰에만 저장돼요.</p>
    <div class="stack">
      ${count()===3?`<button class="big" type="button" data-act="finish">완성 화면 보기</button>`:""}
      <button class="big" type="button" data-act="resetAsk">처음부터 다시 하기</button>
      <div id="resetBox" hidden><p>모은 스탬프와 캡처가 모두 지워져요. 정말 다시 시작할까요?</p>
        <button class="big red" type="button" data-act="reset">네, 모두 지우기</button></div>
    </div>`);
  bindActs();
});
$("#scanBtn").addEventListener("click", openScan);

drawMap();
document.fonts && document.fonts.ready.then(()=>drawMap());
</script>
