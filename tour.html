<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: 하늘 위에 S자로 굽이치는 전시 입장권 띠, 그 위에 박·미·자 스티커 스탬프. 모바일 세로 한 열. */
:root{
  color-scheme: light;
  --sky:#8EC5F0; --sky-hi:#B9DDF7; --cloud:#FFFFFF;
  --paper:#F6EEDB; --paper-dim:#E9DFC6; --edge:#9BC53D; --edge-deep:#6E9A1F;
  --ink:#3B2E22; --ink-soft:#7A6A55;
  --red:#E0473E; --pink:#F29BB8; --green:#3FA34D; --navy:#1F4E79;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.55;
  background:
    radial-gradient(ellipse 120px 46px at 12% 18%, var(--cloud) 60%, transparent 62%),
    radial-gradient(ellipse 90px 40px at 22% 15%, var(--cloud) 60%, transparent 62%),
    radial-gradient(ellipse 140px 50px at 88% 46%, var(--cloud) 60%, transparent 62%),
    radial-gradient(ellipse 100px 42px at 78% 43%, var(--cloud) 60%, transparent 62%),
    radial-gradient(ellipse 130px 48px at 8% 78%, var(--cloud) 60%, transparent 62%),
    linear-gradient(180deg, var(--sky-hi) 0%, var(--sky) 45%, var(--sky) 100%);
  background-attachment:fixed;
  background-color:var(--sky);
}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 130px}
header{text-align:center;display:grid;gap:8px;justify-items:center}
h1{
  margin:0;font-family:var(--display);font-weight:400;color:#fff;line-height:1.05;
  font-size:clamp(40px,12vw,56px);letter-spacing:-.01em;text-wrap:balance;
  text-shadow:0 3px 0 var(--navy),3px 0 0 var(--navy),-3px 0 0 var(--navy),0 -3px 0 var(--navy),3px 3px 0 var(--navy),-3px 3px 0 var(--navy),3px -3px 0 var(--navy),-3px -3px 0 var(--navy),0 8px 0 rgba(31,78,121,.35);
}
h1 small{display:block;font-size:.52em;margin-top:4px}
.badge{display:inline-block;background:var(--green);color:#fff;font-family:var(--display);font-size:15px;letter-spacing:.12em;padding:4px 12px 3px;border:3px solid #fff;transform:rotate(-3deg);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.sub{margin:0;font-size:14px;color:var(--navy);font-weight:700}

.progress{margin:16px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--paper);border-radius:999px;padding:8px 16px;width:max-content;max-width:100%;box-shadow:0 3px 0 rgba(31,78,121,.18)}
.chip{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;color:var(--ink-soft);border:2px dashed var(--ink-soft);background:var(--paper-dim);transition:transform .3s}
.chip.on{color:#fff;border:2px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.chip.on[data-k=park]{background:var(--red)} .chip.on[data-k=mi]{background:var(--pink)} .chip.on[data-k=ja]{background:var(--green)}
.count{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;color:var(--ink)}

.how{margin:14px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12.5px;line-height:1.35;text-align:center}
.how div{background:rgba(255,255,255,.75);border-radius:10px;padding:8px 6px;min-width:0}
.how b{display:block;font-family:var(--display);font-weight:400;font-size:14px;color:var(--navy)}

.map{margin-top:6px;position:relative}
.map svg{width:100%;height:auto;display:block;overflow:visible}
.stamp{cursor:pointer;outline:none}
.stamp .shape{transition:fill .3s}
.stamp:focus-visible .focus{stroke:var(--navy);stroke-width:4;stroke-dasharray:6 5}
.stamp .pop{transform-box:fill-box;transform-origin:center}
.stamp.just .pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.bob{animation:bob 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}

.dock{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:10px;background:linear-gradient(180deg,transparent,rgba(95,168,227,.55) 40%);z-index:5}
.btn{font:inherit;cursor:pointer;border:none}
.scan{font-family:var(--display);font-size:21px;color:#fff;background:var(--red);border:4px solid #fff;border-radius:18px;padding:12px 26px;transform:rotate(-2deg);box-shadow:0 5px 0 #9d2a23,0 8px 18px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px}
.scan:active{transform:rotate(-2deg) translateY(4px);box-shadow:0 1px 0 #9d2a23}
.scan svg{width:26px;height:26px}
.gear{width:52px;height:52px;border-radius:50%;background:var(--paper);border:3px solid #fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 rgba(31,78,121,.3);align-self:center}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,40,60,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto;position:relative;border-top:6px dashed var(--edge);animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.close{position:absolute;top:12px;right:14px;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--ink);font-size:20px;line-height:1}
.sheet h2{margin:0 44px 4px 0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2}
.sheet .eyebrow{font-size:13px;color:var(--ink-soft);letter-spacing:.06em}
.sheet p{margin:8px 0}
.stack{display:grid;gap:10px;margin-top:14px}
.big{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:18px;padding:14px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:center}
.big.red{background:var(--red);color:#fff}
.big.green{background:var(--green);color:#fff}
.big.insta{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF);color:#fff}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.big[aria-disabled=true]{opacity:.45;pointer-events:none}
.ghost{background:transparent;border:none;color:var(--navy);text-decoration:underline;font:inherit;cursor:pointer;padding:6px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.row{display:flex;gap:8px}
.field{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px;border-radius:12px;border:2px solid var(--ink-soft);background:#fff;color:var(--ink);text-transform:uppercase}
.field:focus{outline:3px solid var(--edge);border-color:var(--ink)}
.small{font-size:13px;color:var(--ink-soft)}
.step{display:flex;gap:10px;align-items:flex-start}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);display:grid;place-items:center;font-size:14px;margin-top:2px}
.step > div{min-width:0;flex:1}
.shot{display:block;max-width:100%;max-height:300px;margin:10px auto 0;border-radius:12px;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.done-tag{display:inline-block;background:var(--green);color:#fff;font-family:var(--display);padding:3px 10px;border-radius:8px;transform:rotate(-2deg)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0;background:#fff;border-radius:12px;padding:10px 14px}
.meta dt{color:var(--ink-soft)} .meta dd{margin:0}
.busy{display:flex;align-items:center;gap:10px;justify-content:center;padding:10px;color:var(--ink-soft)}

/* complete */
.finish{text-align:center}
.finish .starwrap{width:220px;max-width:70%;margin:0 auto}
.finish h2{margin:0;font-size:30px}
.redeemed{display:inline-block;margin-top:10px;border:4px solid var(--red);color:var(--red);font-family:var(--display);font-size:22px;padding:4px 16px;border-radius:10px;transform:rotate(-8deg);opacity:.9}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:40;max-width:calc(100% - 32px);text-align:center;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>박미자<small>스탬프 투어</small></h1>

<script>
/* ===================== 설정 영역 (여기만 고치면 돼요) ===================== */
const CONFIG = {
  instagramId: "",                 // 자연사박물관 인스타 아이디 (@ 없이). 예: "knu_museum"
  reward: "자연사박물관 안내데스크에서 이 화면을 보여주시면 기념품을 드려요.",
  staffPin: "0000",                // 기념품 지급 확인용 직원 비밀번호
  places: [
    { key:"park", ch:"박", name:"경북대학교 박물관", code:"PMJ-MUSEUM-R8K2", how:"qr",
      color:"var(--red)", desc:"오래된 유물과 지역의 역사를 만나는 곳. 관 안에 붙은 QR을 찾아 찍어 보세요.",
      hours:"현장 안내를 확인하세요", map:"경북대학교 박물관" },
    { key:"mi", ch:"미", name:"경북대학교 미술관", code:"PMJ-ART-T4W7", how:"qr",
      color:"var(--pink)", desc:"지금 열리는 전시를 둘러보고, 관 안에 붙은 QR을 찾아 찍어 보세요.",
      hours:"현장 안내를 확인하세요", map:"경북대학교 미술관" },
    { key:"ja", ch:"자", name:"경북대학교 자연사박물관", code:null, how:"insta",
      color:"var(--green)", desc:"표본과 화석을 구경하고, 인스타그램을 팔로우하면 마지막 스탬프 완성!",
      hours:"현장 안내를 확인하세요", map:"경북대학교 자연사박물관" }
  ]
};
/* ======================================================================= */

const KEY = "pmj-tour-v1";
let S = { stamps:{}, shot:null, completedAt:null, redeemed:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { toast("이 브라우저에서는 기록이 저장되지 않을 수 있어요"); } }

const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => { const d = new Date(t); return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const place = k => CONFIG.places.find(p => p.key === k);
const count = () => CONFIG.places.filter(p => S.stamps[p.key]).length;

/* ---------- 지도 그리기 ---------- */
const RIBBON = "M 18 70 C 130 40, 270 50, 310 120 C 345 185, 280 235, 190 240 C 90 246, 22 290, 48 360 C 74 425, 250 405, 304 470 C 345 525, 290 585, 186 592";
const SHAPES = {
  // 항아리
  park: "M-20,-54 L20,-54 L22,-44 C54,-36 62,-6 55,20 C47,46 24,56 0,56 C-24,56 -47,46 -55,20 C-62,-6 -54,-36 -22,-44 Z",
  // 팔레트 (엄지 구멍 포함)
  mi: "M2,-52 C44,-54 66,-20 60,10 C56,30 34,26 30,40 C26,58 -8,60 -34,50 C-62,38 -66,-2 -52,-28 C-41,-46 -22,-52 2,-52 Z M28,14 a9,9 0 1,0 0.1,0 Z",
  // 암모나이트
  ja: "M0,-56 A56,56 0 1,1 -0.1,-56 Z"
};
const POS = { park:[262,150,-6], mi:[92,312,5], ja:[268,472,-4] };

function spiral(){
  let d = ""; for (let t=0; t<=4.2*Math.PI; t+=0.15){ const r = 4 + 3.7*t; const x = r*Math.cos(t), y = r*Math.sin(t); d += (d?"L":"M")+x.toFixed(1)+","+y.toFixed(1); }
  return d;
}
function el(tag, attrs, parent){ const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }

function sticker(svg, kind, x, y, rot, s=1){
  const g = el("g", {transform:`translate(${x},${y}) rotate(${rot}) scale(${s})`}, svg);
  const inner = el("g", {class:"bob", style:`animation-delay:${(x%7)/3}s`}, g);
  const W = {stroke:"#fff","stroke-width":5,"paint-order":"stroke","stroke-linejoin":"round"};
  if (kind==="smile"){ el("circle",{r:20,fill:"#F6A6C1",...W},inner); el("circle",{cx:-7,cy:-5,r:2.6,fill:"#3B2E22"},inner); el("circle",{cx:7,cy:-5,r:2.6,fill:"#3B2E22"},inner); el("path",{d:"M-9,4 Q0,13 9,4",fill:"none",stroke:"#3B2E22","stroke-width":2.6,"stroke-linecap":"round"},inner); }
  if (kind==="star"){ el("path",{d:"M0,-18 L5,-6 L18,-6 L8,2 L12,15 L0,7 L-12,15 L-8,2 L-18,-6 L-5,-6 Z",fill:"#A8E06A",...W},inner); }
  if (kind==="butterfly"){ el("ellipse",{cx:-10,cy:-6,rx:11,ry:9,fill:"#F2C14E",...W},inner); el("ellipse",{cx:10,cy:-6,rx:11,ry:9,fill:"#F2C14E",...W},inner); el("ellipse",{cx:-8,cy:9,rx:7,ry:6,fill:"#E98A3C",...W},inner); el("ellipse",{cx:8,cy:9,rx:7,ry:6,fill:"#E98A3C",...W},inner); el("rect",{x:-2,y:-12,width:4,height:26,rx:2,fill:"#3B2E22"},inner); }
  if (kind==="leaf"){ el("path",{d:"M-16,14 C-18,-10 4,-20 18,-18 C18,0 6,18 -16,14 Z",fill:"#4FB062",...W},inner); el("path",{d:"M-14,12 L12,-12",stroke:"#2F7D3E","stroke-width":2,fill:"none"},inner); }
  if (kind==="foot"){ const f="#C9A26B"; el("ellipse",{cx:0,cy:6,rx:10,ry:9,fill:f,...W},inner); el("ellipse",{cx:-10,cy:-10,rx:4.5,ry:9,transform:"rotate(-20 -10 -10)",fill:f,...W},inner); el("ellipse",{cx:0,cy:-14,rx:4.5,ry:9,fill:f,...W},inner); el("ellipse",{cx:10,cy:-10,rx:4.5,ry:9,transform:"rotate(20 10 -10)",fill:f,...W},inner); }
  if (kind==="glass"){ el("path",{d:"M8,8 L20,20",stroke:"#7A5230","stroke-width":7,"stroke-linecap":"round"},inner); el("circle",{r:13,fill:"#DDF1FF",stroke:"#2D3B4A","stroke-width":4},inner); }
  if (kind==="bug"){ el("ellipse",{cx:0,cy:2,rx:14,ry:12,fill:"#E0473E",...W},inner); el("circle",{cx:0,cy:-11,r:6,fill:"#2B2B2B"},inner); el("path",{d:"M0,-8 L0,14",stroke:"#2B2B2B","stroke-width":2},inner); el("circle",{cx:-6,cy:0,r:2.6,fill:"#2B2B2B"},inner); el("circle",{cx:6,cy:5,r:2.6,fill:"#2B2B2B"},inner); }
}

function drawMap(justKey){
  const svg = $("#map"); svg.innerHTML = "";
  // 리본(입장권 띠)
  el("path",{d:RIBBON,fill:"none",stroke:"rgba(31,78,121,.18)","stroke-width":70,"stroke-linecap":"round",transform:"translate(0,6)"},svg);
  el("path",{d:RIBBON,fill:"none",stroke:"var(--edge)","stroke-width":70,"stroke-linecap":"round"},svg);
  el("path",{d:RIBBON,fill:"none",stroke:"var(--paper)","stroke-width":56,"stroke-linecap":"round"},svg);
  el("path",{d:RIBBON,fill:"none",stroke:"var(--edge-deep)","stroke-width":1.6,"stroke-dasharray":"5 6",opacity:.55},svg);

  // 출발 표지
  const st = el("g",{transform:"translate(40,58) rotate(-6)"},svg);
  el("rect",{x:-30,y:-17,width:64,height:34,rx:8,fill:"var(--navy)",stroke:"#fff","stroke-width":4},st);
  const t0 = el("text",{x:2,y:7,"text-anchor":"middle","font-family":"Black Han Sans, sans-serif","font-size":19,fill:"#fff"},st); t0.textContent="출발!";

  // 장식 스티커
  sticker(svg,"smile",326,40,10); sticker(svg,"star",168,96,-8,.9); sticker(svg,"butterfly",30,200,-12);
  sticker(svg,"glass",332,270,12); sticker(svg,"leaf",196,348,18); sticker(svg,"bug",150,214,-20,.8);
  sticker(svg,"foot",34,470,-18); sticker(svg,"star",332,580,14,.8); sticker(svg,"leaf",56,566,-30,.8);

  // 스탬프
  for (const p of CONFIG.places){
    const [x,y,r] = POS[p.key]; const got = !!S.stamps[p.key];
    const g = el("g",{class:"stamp"+(justKey===p.key?" just":""),transform:`translate(${x},${y}) rotate(${r})`,tabindex:0,role:"button","aria-label":`${p.ch}, ${p.name}, ${got?"획득":"미획득"}`},svg);
    g.addEventListener("click",()=>openPlace(p.key));
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openPlace(p.key); } });
    const pop = el("g",{class:"pop"},g);
    el("path",{d:SHAPES[p.key],transform:"translate(0,5)",fill:"rgba(31,78,121,.22)","fill-rule":"evenodd"},pop);
    el("path",{class:"shape",d:SHAPES[p.key],"fill-rule":"evenodd",fill:got?p.color:"var(--paper-dim)",stroke:"#fff","stroke-width":7,"stroke-linejoin":"round"},pop);
    el("path",{class:"focus",d:SHAPES[p.key],"fill-rule":"evenodd",fill:"none",stroke:got?"none":"var(--ink-soft)","stroke-width":2,"stroke-dasharray":"6 5"},pop);
    if (p.key==="ja") el("path",{d:spiral(),fill:"none",stroke:got?"rgba(255,255,255,.55)":"rgba(122,106,85,.35)","stroke-width":3,"stroke-linecap":"round"},pop);
    if (p.key==="mi"){ [["-30","-18","#F2C14E"],["-6","-32","#4FA3E0"],["20","-24","#3FA34D"],["-38","12","#E0473E"]].forEach(([cx,cy,c])=>el("circle",{cx,cy,r:7,fill:got?"#fff":c,opacity:got?.85:.55},pop)); }
    if (p.key==="park") el("path",{d:"M-36,-10 C-12,-2 12,-2 36,-10",fill:"none",stroke:got?"rgba(255,255,255,.6)":"rgba(122,106,85,.35)","stroke-width":3},pop);
    const tx = el("text",{x:p.key==="mi"?-4:0,y:p.key==="mi"?16:18,"text-anchor":"middle","font-family":"Black Han Sans, sans-serif","font-size":46,fill:got?"#fff":"rgba(122,106,85,.55)",stroke:got?"var(--ink)":"none","stroke-width":got?1.5:0,"paint-order":"stroke"},pop); tx.textContent = p.ch;
    // 이름표
    const lbl = el("g",{transform:`translate(0,${p.key==="mi"?70:76}) rotate(${-r*0.6})`},pop);
    const label = p.name.replace("경북대학교 ","");
    const w = label.length*15+24;
    el("rect",{x:-w/2,y:-14,width:w,height:28,rx:8,fill:"#fff",stroke:"var(--ink)","stroke-width":2},lbl);
    const lt = el("text",{x:0,y:6,"text-anchor":"middle","font-family":"Gowun Dodum, sans-serif","font-size":15,"font-weight":700,fill:"var(--ink)"},lbl); lt.textContent = label;
    if (got){
      const ck = el("g",{transform:"translate(44,-44)"},pop);
      el("circle",{r:15,fill:"var(--ink)",stroke:"#fff","stroke-width":3},ck);
      el("path",{d:"M-6,0 L-1,5 L7,-5",fill:"none",stroke:"#fff","stroke-width":3.4,"stroke-linecap":"round","stroke-linejoin":"round"},ck);
    }
  }

  // 완성 별
  const all = count()===3;
  const fin = el("g",{transform:"translate(180,590) rotate(-5)",class:"stamp",tabindex:0,role:"button","aria-label":"완성 화면"},svg);
  fin.addEventListener("click",()=> all ? openFinish() : toast(`스탬프 ${3-count()}개만 더 모으면 완성이에요!`));
  el("path",{d:"M0,-34 L10,-11 L34,-10 L15,6 L22,30 L0,17 L-22,30 L-15,6 L-34,-10 L-10,-11 Z",fill:all?"#F2C14E":"var(--paper-dim)",stroke:"#fff","stroke-width":6,"stroke-linejoin":"round"},fin);
  const ft = el("text",{x:0,y:8,"text-anchor":"middle","font-family":"Black Han Sans, sans-serif","font-size":15,fill:all?"var(--ink)":"var(--ink-soft)"},fin); ft.textContent="완성";

  // 진행도
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",!!S.stamps[c.dataset.k]));
  $("#count").textContent = `${count()} / 3`;
}

/* ---------- 시트 ---------- */
let lastFocus = null;
function openSheet(html){ lastFocus = document.activeElement; $("#sheet").innerHTML = `<button class="btn close" type="button" aria-label="닫기" data-close>✕</button>` + html; $("#veil").hidden = false; $("#sheet").querySelector("[data-close]").focus(); }
function closeSheet(){ $("#veil").hidden = true; $("#sheet").innerHTML = ""; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$("#veil").addEventListener("click", e => { if (e.target.id==="veil" || e.target.closest("[data-close]")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key==="Escape" && !$("#veil").hidden) closeSheet(); });

let tt; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600); }

function mapLink(q){ return "https://map.naver.com/p/search/" + encodeURIComponent(q); }

function openPlace(k){
  const p = place(k); const got = S.stamps[k];
  let body = `<div class="eyebrow">${p.how==="qr"?"QR 인증":"인스타그램 팔로우 인증"}</div>
    <h2>${p.ch} · ${esc(p.name)}</h2>
    ${got?`<span class="done-tag">스탬프 획득 · ${fmt(got)}</span>`:""}
    <p>${esc(p.desc)}</p>
    <dl class="meta"><dt>운영시간</dt><dd>${esc(p.hours)}</dd></dl>
    <div class="stack">`;
  if (p.how==="qr"){
    body += got ? "" : `<button class="big red" type="button" data-act="scan">QR 스캔하러 가기</button>`;
  } else {
    const handle = CONFIG.instagramId;
    body += `<div class="step"><span class="n">1</span><div><b>인스타그램 팔로우하기</b>
        <div class="stack" style="margin-top:8px"><a class="big insta" href="https://www.instagram.com/${encodeURIComponent(handle)}/" target="_blank" rel="noopener">${handle?"@"+esc(handle)+" 팔로우하러 가기":"인스타그램 열기"}</a></div></div></div>
      <div class="step"><span class="n">2</span><div><b>팔로우한 화면을 캡처해서 올리기</b>
        <p class="small">'팔로잉'이 보이는 프로필 화면을 캡처해 주세요.</p>
        <div class="stack"><button class="big" type="button" data-act="shot">${S.shot?"캡처 다시 올리기":"캡처 사진 올리기"}</button></div>
        ${S.shot?`<img class="shot" src="${S.shot}" alt="올린 팔로우 캡처">`:""}</div></div>
      ${!got && S.shot ? `<button class="big green" type="button" data-act="instaOk">인증 완료하고 스탬프 받기</button>`:""}`;
  }
  body += `<a class="big" href="${mapLink(p.map)}" target="_blank" rel="noopener">네이버 지도에서 보기</a></div>`;
  openSheet(body);
  bindActs();
}

function openScan(){
  openSheet(`<div class="eyebrow">박물관 · 미술관</div><h2>QR 스캔하기</h2>
    <p>관 안에 붙은 박미자 QR을 화면 가득 찍어 주세요. 사진을 찍으면 바로 스탬프가 찍혀요.</p>
    <div class="stack">
      <button class="big red" type="button" data-act="cam">카메라로 QR 찍기</button>
      <button class="big" type="button" data-act="album">사진첩에서 QR 사진 고르기</button>
      <div id="busy" class="busy" hidden>QR을 읽는 중이에요…</div>
    </div>
    <div class="stack">
      <label class="small" for="codeIn">카메라가 안 되나요? QR 아래 적힌 코드를 입력하세요.</label>
      <form class="row" id="codeForm"><input class="field" id="codeIn" autocomplete="off" placeholder="PMJ-…" inputmode="latin"><button class="big" type="submit" style="padding:12px 16px">확인</button></form>
    </div>`);
  bindActs();
  $("#codeForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#codeIn").value.trim(); if (!v) return toast("코드를 입력해 주세요"); handleCode(v); });
}

function bindActs(){
  $("#sheet").querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const a = b.dataset.act;
    if (a==="scan") openScan();
    if (a==="cam") $("#camIn").click();
    if (a==="album") $("#albumIn").click();
    if (a==="shot") $("#shotIn").click();
    if (a==="instaOk"){ award("ja"); }
    if (a==="pin") checkPin();
    if (a==="reset") { S = { stamps:{}, shot:null, completedAt:null, redeemed:null }; save(); closeSheet(); drawMap(); toast("처음부터 다시 시작해요"); }
    if (a==="resetAsk") { $("#resetBox").hidden = false; b.hidden = true; }
    if (a==="finish") openFinish();
  }));
}

/* ---------- QR 읽기 ---------- */
function loadImg(file){ return new Promise((res,rej)=>{ const u = URL.createObjectURL(file); const i = new Image(); i.onload=()=>{ res(i); }; i.onerror=rej; i.src=u; }); }
async function decode(file){
  const img = await loadImg(file);
  const c = document.createElement("canvas"); const ctx = c.getContext("2d", { willReadFrequently:true });
  for (const max of [1000, 700, 1500, 450]){
    const s = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    ctx.drawImage(img,0,0,c.width,c.height);
    if ("BarcodeDetector" in window){ try { const r = await new BarcodeDetector({formats:["qr_code"]}).detect(c); if (r && r[0]) return r[0].rawValue; } catch(e){} }
    if (window.jsQR){ const d = ctx.getImageData(0,0,c.width,c.height); const r = jsQR(d.data,c.width,c.height,{inversionAttempts:"attemptBoth"}); if (r && r.data) return r.data; }
  }
  return null;
}
async function onPhoto(e){
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  const busy = $("#busy"); if (busy) busy.hidden = false;
  let text = null; try { text = await decode(f); } catch(err) {}
  if (busy) busy.hidden = true;
  if (!text) return toast("QR을 찾지 못했어요. QR이 화면 가운데 크게 나오게 다시 찍어 주세요.");
  handleCode(text);
}
$("#camIn").addEventListener("change", onPhoto);
$("#albumIn").addEventListener("change", onPhoto);

function handleCode(text){
  const t = String(text).toUpperCase().replace(/\s/g,"");
  const p = CONFIG.places.find(p => p.code && t.includes(p.code.toUpperCase()));
  if (!p) return toast("박미자 투어의 QR이 아니에요");
  if (S.stamps[p.key]) { closeSheet(); return toast(`'${p.ch}' 스탬프는 이미 받았어요`); }
  award(p.key);
}

function award(k){
  S.stamps[k] = Date.now();
  if (count()===3 && !S.completedAt) S.completedAt = Date.now();
  save(); closeSheet(); drawMap(k);
  try { navigator.vibrate && navigator.vibrate([60,40,90]); } catch(e){}
  const p = place(k);
  if (count()===3){ confetti(); setTimeout(openFinish, 900); }
  else toast(`'${p.ch}' 스탬프 획득! ${3-count()}개 남았어요`);
}

/* ---------- 인스타 캡처 ---------- */
$("#shotIn").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const img = await loadImg(f); const s = Math.min(1, 600/img.naturalWidth);
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    S.shot = c.toDataURL("image/jpeg",0.72); save(); openPlace("ja");
  } catch(err){ toast("사진을 열지 못했어요. 다른 사진으로 시도해 주세요."); }
});

/* ---------- 완성 ---------- */
function openFinish(){
  openSheet(`<div class="finish">
    <div class="starwrap"><svg viewBox="-70 -70 140 140" aria-hidden="true">
      <path d="M0,-62 L18,-20 L62,-18 L28,10 L40,56 L0,32 L-40,56 L-28,10 L-62,-18 L-18,-20 Z" fill="#F2C14E" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
      <text x="0" y="12" text-anchor="middle" font-family="Black Han Sans, sans-serif" font-size="30" fill="#3B2E22">박미자</text></svg></div>
    <h2>박미자 완성!</h2>
    <p>${S.completedAt?fmt(S.completedAt)+" 완주":""}</p>
    <p><b>${esc(CONFIG.reward)}</b></p>
    ${S.redeemed?`<div class="redeemed">기념품 수령 완료</div><p class="small">${fmt(S.redeemed)}</p>`:""}
    ${S.shot?`<p class="small" style="margin-top:16px">직원 확인용 · 인스타 팔로우 캡처</p><img class="shot" src="${S.shot}" alt="인스타 팔로우 캡처">`:""}
    ${S.redeemed?"":`<div class="stack" style="text-align:left;margin-top:18px">
      <label class="small" for="pinIn">직원 전용 · 기념품을 드린 뒤 비밀번호를 입력하세요</label>
      <div class="row"><input class="field" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><button class="big" type="button" data-act="pin" style="padding:12px 16px">지급 완료</button></div></div>`}
  </div>`);
  bindActs();
}
function checkPin(){
  if ($("#pinIn").value.trim() !== CONFIG.staffPin) return toast("비밀번호가 맞지 않아요");
  S.redeemed = Date.now(); save(); openFinish(); toast("기념품 지급 완료로 표시했어요");
}

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = $("#confetti"); const cols = ["#E0473E","#F29BB8","#3FA34D","#F2C14E","#fff","#4FA3E0"];
  for (let i=0;i<70;i++){ const p=document.createElement("i"); p.style.left=Math.random()*100+"vw"; p.style.background=cols[i%cols.length]; p.style.animationDuration=(1.8+Math.random()*1.8)+"s"; p.style.animationDelay=(Math.random()*.6)+"s"; box.appendChild(p); }
  setTimeout(()=>box.innerHTML="",4500);
}

/* ---------- 설정 ---------- */
$("#gearBtn").addEventListener("click", () => {
  openSheet(`<h2>설정</h2>
    <p class="small">기록은 이 휴대폰에만 저장돼요.</p>
    <div class="stack">
      ${count()===3?`<button class="big" type="button" data-act="finish">완성 화면 보기</button>`:""}
      <button class="big" type="button" data-act="resetAsk">처음부터 다시 하기</button>
      <div id="resetBox" hidden><p>모은 스탬프와 캡처가 모두 지워져요. 정말 다시 시작할까요?</p>
        <button class="big red" type="button" data-act="reset">네, 모두 지우기</button></div>
    </div>`);
  bindActs();
});
$("#scanBtn").addEventListener("click", openScan);

drawMap();
document.fonts && document.fonts.ready.then(()=>drawMap());
</script>
